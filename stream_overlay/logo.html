<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Logo</title>
<link rel="stylesheet" href="assets/overlay.css">
<style>
  html, body { margin: 0; background: transparent; }
  #lg { --f-disp: "OV Anton", "Anton", Impact, sans-serif; --f-hud: "OV Raj", "Rajdhani", sans-serif;
    --f-clean: "OV MontUp", "Montserrat", sans-serif; --f-shout: "OV Mont", "Montserrat", sans-serif; }
  #lg { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
  #lg > svg { width: 92%; height: 92%; overflow: visible; }
  .av { position: relative; width: 100%; height: 100%; }
  .av .bg { position: absolute; inset: 5%; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 50% 36%, #ff3653 0%, #b0001f 46%, #3a0009 78%, #12030a 100%);
    box-shadow: 0 0 0 1.6vmin #0a0205, 0 0 0 2.6vmin #ffcf4a, 0 2vmin 4vmin rgba(0,0,0,.5); }
  .av .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(40,0,8,.35) 1.2px, transparent 1.7px) 0 0 / 2.2vmin 2.2vmin; }
  .av .m { position: absolute; left: 12%; top: 12%; width: 76%; height: 80%; }
  .av .m svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<!-- ?kind=mascot&pose=game|win|wink | avatar | wordmark | grunge   (dipakai oleh tools/export_logos.js) -->
<div id="lg"></div>
<script src="assets/config.js"></script>
<script src="assets/overlay.js"></script>
<script src="assets/banner-pro.js"></script>
<script src="assets/ranks3d.js"></script>
<script src="assets/logos.js"></script>
<script src="assets/banner-scene.js"></script>
<script src="assets/mascot.js"></script>
<script src="assets/banner-power.js"></script>
<script>
  const O = ChouOverlay, p = new URLSearchParams(location.search);
  const kind = p.get("kind") || "mascot", pose = p.get("pose") || "game";
  const box = document.getElementById("lg");
  let svg, anim;
  if (kind === "grunge") { box.innerHTML = O.logos.grungeSVG(O.ACCENTS.crimson); svg = box.firstElementChild; anim = () => O.logos.animGrunge(svg, 10, 1.1); }
  else if (kind === "wordmark") { box.innerHTML = O.powerWord.svg(); svg = box.firstElementChild; anim = () => O.powerWord.anim(svg, 1.5); }
  else if (kind === "avatar") {
    box.innerHTML = `<div class="av"><div class="bg"></div><div class="m">${O.mascot3d.svg()}</div></div>`;
    svg = box.querySelector(".m svg"); anim = () => O.mascot3d.anim(svg, 1.1, { pose });
  } else { box.innerHTML = O.mascot3d.svg(); svg = box.firstElementChild; anim = () => O.mascot3d.anim(svg, 1.1, { pose, gg: true }); }
  window.__pose = anim;
  document.fonts.ready.then(() => window.__pose());
</script>
</body>
</html>
