<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Potong Logo Rank</title>
<link rel="stylesheet" href="assets/overlay.css">
<style>
  /* Rank icon cutter: drop one picture with all rank icons on a white background,
     it finds each icon, removes the white background and saves epic.png ... immortal.png. */
  :root { --bg: #0b0507; --card: #170a0e; --line: rgba(255,90,110,.22); --fg: #f6eff0; --mut: rgba(246,239,240,.62); --red: #ff2346; --gold: #ffcf4a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 600 15px/1.45 "OV Raj", Rajdhani, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font: 400 34px/1 "OV Anton", Anton, Impact, sans-serif; transform: skewX(-8deg); }
  h1 b { font-weight: 400; color: var(--red); }
  p { margin: 0; color: var(--mut); max-width: 70ch; }
  .drop { border: 2px dashed var(--line); padding: 26px; text-align: center; background: var(--card); cursor: pointer; }
  .drop.on { border-color: var(--gold); }
  .drop b { color: var(--fg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { background: repeating-conic-gradient(#1e1015 0 25%, #140a0e 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .tile select { font: inherit; color: var(--fg); background: #0a0405; border: 1px solid var(--line); padding: 6px; }
  .tile.skip img { opacity: .3; }
  .btn { font: 700 15px/1 inherit; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--red); border: 0; padding: 14px 18px; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .msg { color: var(--gold); min-height: 1.4em; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; letter-spacing: .14em; color: var(--mut); text-transform: uppercase; }
  input[type=password] { font: inherit; color: var(--fg); background: #0a0405; border: 1px solid var(--line); padding: 8px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>POTONG <b>LOGO RANK</b></h1>
  <p>Masukkan <b>satu gambar</b> yang ada semua logo rank (latar putih, macam senarai Warrior hingga Mythical Immortal). Alat ni cari setiap logo, buang latar putih, dan simpan Epic, Legend, Mythic, Mythical Honor, Mythical Glory dan Mythical Immortal terus ke overlay.</p>
  <label class="drop" id="drop" for="file"><b>Klik untuk pilih gambar</b> atau seret gambar ke sini<input id="file" type="file" accept="image/*" hidden></label>
  <div class="msg" id="msg"></div>
  <div class="grid" id="grid"></div>
  <div class="row" id="saveRow" hidden>
    <label class="fld" id="pinBox" hidden>PIN admin<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="btn" id="save" type="button">Simpan ke overlay</button>
  </div>
</div>
<script>
(function () {
  "use strict";
  const RANKS = [["", "— abai —"], ["epic", "Epic"], ["legend", "Legend"], ["mythic", "Mythic"], ["honor", "Mythical Honor"], ["glory", "Mythical Glory"], ["immortal", "Mythical Immortal"]];
  const $ = id => document.getElementById(id);
  const msg = t => { $("msg").textContent = t; };
  let tiles = [];

  const drop = $("drop");
  ["dragover", "dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("on"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("on"); }));
  drop.addEventListener("drop", ev => { const f = ev.dataTransfer.files[0]; if (f) load(f); });
  $("file").addEventListener("change", ev => { const f = ev.target.files[0]; if (f) load(f); });
  document.addEventListener("paste", ev => { const it = [...(ev.clipboardData || {}).items || []].find(i => i.type.startsWith("image/")); if (it) load(it.getAsFile()); });

  function load(file) {
    msg("Memproses gambar…");
    const img = new Image();
    img.onload = () => { try { process(img); } catch (e) { msg("Gagal proses gambar: " + e.message); } URL.revokeObjectURL(img.src); };
    img.onerror = () => msg("Fail ni bukan gambar.");
    img.src = URL.createObjectURL(file);
  }

  // ---- core: background flood fill + connected components ----
  function process(img) {
    const scale = Math.min(1, 2600 / Math.max(img.naturalWidth, img.naturalHeight));
    const W = Math.round(img.naturalWidth * scale), H = Math.round(img.naturalHeight * scale);
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(img, 0, 0, W, H);
    const px = cx.getImageData(0, 0, W, H).data;
    const N = W * H, bg = new Uint8Array(N);
    const isBgCol = i => { const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2], a = px[i * 4 + 3];
      return a < 30 || (r > 240 && g > 240 && b > 240 && Math.max(r, g, b) - Math.min(r, g, b) < 16); };
    const q = new Int32Array(N); let qh = 0, qt = 0;
    const seed = i => { if (!bg[i] && isBgCol(i)) { bg[i] = 1; q[qt++] = i; } };
    for (let x = 0; x < W; x++) { seed(x); seed((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { seed(y * W); seed(y * W + W - 1); }
    while (qh < qt) { const i = q[qh++], x = i % W; if (x > 0) seed(i - 1); if (x < W - 1) seed(i + 1); if (i >= W) seed(i - W); if (i < N - W) seed(i + W); }
    // components of non-background
    const lab = new Int32Array(N); const comps = [];
    for (let s = 0; s < N; s++) {
      if (bg[s] || lab[s]) continue;
      const id = comps.length + 1; let x0 = W, y0 = H, x1 = 0, y1 = 0, area = 0;
      qh = 0; qt = 0; q[qt++] = s; lab[s] = id;
      while (qh < qt) {
        const i = q[qh++], x = i % W, y = (i / W) | 0; area++;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i >= W ? i - W : -1, i < N - W ? i + W : -1];
        for (const j of nb) if (j >= 0 && !bg[j] && !lab[j]) { lab[j] = id; q[qt++] = j; }
      }
      comps.push({ id, x0, y0, x1, y1, area });
    }
    if (!comps.length) { msg("Tak jumpa logo. Pastikan latar gambar putih."); return; }
    const maxA = Math.max(...comps.map(c => c.area));
    let big = comps.filter(c => c.area >= maxA * .28 && (c.x1 - c.x0) > 40 && (c.y1 - c.y0) > 40);
    // rows by vertical centre
    big.forEach(c => { c.cy = (c.y0 + c.y1) / 2; c.cx = (c.x0 + c.x1) / 2; c.h = c.y1 - c.y0; });
    big.sort((a, b) => a.cy - b.cy);
    const rows = []; for (const c of big) { const r = rows.find(r => Math.abs(r.cy - c.cy) < c.h * .5); if (r) { r.items.push(c); r.cy = (r.cy + c.cy) / 2; } else rows.push({ cy: c.cy, items: [c] }); }
    rows.forEach(r => r.items.sort((a, b) => a.cx - b.cx));
    const ordered = rows.flatMap(r => r.items);
    // default assignment: the classic chart (row 1: Warrior..Legend, row 2: Mythic..Immortal)
    const guess = new Map();
    if (rows.length >= 2 && rows[0].items.length >= 2 && rows[1].items.length === 4) {
      const r0 = rows[0].items; guess.set(r0[r0.length - 2], "epic"); guess.set(r0[r0.length - 1], "legend");
      ["mythic", "honor", "glory", "immortal"].forEach((k, i) => guess.set(rows[1].items[i], k));
    } else if (ordered.length === 6) ordered.forEach((c, i) => guess.set(c, ["epic", "legend", "mythic", "honor", "glory", "immortal"][i]));
    // cut each icon
    tiles = ordered.map(c => {
      const pad = Math.round(Math.max(c.x1 - c.x0, c.y1 - c.y0) * .04);
      const X0 = Math.max(0, c.x0 - pad), Y0 = Math.max(0, c.y0 - pad), X1 = Math.min(W - 1, c.x1 + pad), Y1 = Math.min(H - 1, c.y1 + pad);
      const w = X1 - X0 + 1, h = Y1 - Y0 + 1, side = Math.max(w, h);
      const out = document.createElement("canvas"); out.width = side; out.height = side;
      const o = out.getContext("2d"), od = o.createImageData(side, side), d = od.data;
      const ox = Math.floor((side - w) / 2), oy = Math.floor((side - h) / 2);
      for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) {
        const i = y * W + x; if (bg[i]) continue;
        const L = lab[i]; if (L !== c.id) { const cc = comps[L - 1]; if (!cc || cc.x0 < X0 || cc.x1 > X1 || cc.y0 < Y0 || cc.y1 > Y1 || cc.area > c.area) continue; }
        const k = ((y - Y0 + oy) * side + (x - X0 + ox)) * 4;
        let a = px[i * 4 + 3];
        // soften the white halo on the edge
        const edge = (x > 0 && bg[i - 1]) || (x < W - 1 && bg[i + 1]) || (y > 0 && bg[i - W]) || (y < H - 1 && bg[i + W]);
        if (edge) { const mn = Math.min(px[i * 4], px[i * 4 + 1], px[i * 4 + 2]); a = Math.min(a, Math.max(0, Math.min(255, (255 - mn) * 6))); }
        d[k] = px[i * 4]; d[k + 1] = px[i * 4 + 1]; d[k + 2] = px[i * 4 + 2]; d[k + 3] = a;
      }
      o.putImageData(od, 0, 0);
      return { canvas: out, rank: guess.get(c) || "" };
    });
    render();
    msg(`Jumpa ${tiles.length} logo. Semak nama setiap logo di bawah (betulkan kalau salah), kemudian tekan Simpan.`);
  }

  function render() {
    $("grid").innerHTML = "";
    tiles.forEach((t, i) => {
      const d = document.createElement("div"); d.className = "tile" + (t.rank ? "" : " skip");
      const im = new Image(); im.src = t.canvas.toDataURL("image/png"); im.alt = "Logo " + (i + 1);
      const sel = document.createElement("select"); sel.setAttribute("aria-label", "Rank untuk logo " + (i + 1));
      RANKS.forEach(([v, l]) => { const o = document.createElement("option"); o.value = v; o.textContent = l; if (v === t.rank) o.selected = true; sel.appendChild(o); });
      sel.addEventListener("change", () => { t.rank = sel.value; d.className = "tile" + (t.rank ? "" : " skip"); });
      d.append(im, sel); $("grid").appendChild(d);
    });
    $("saveRow").hidden = !tiles.length;
  }

  // PIN needed only when this page is opened from another device
  fetch("api/auth", { cache: "no-store" }).then(r => r.json()).then(a => { if (!a.local) $("pinBox").hidden = false; }).catch(() => {});

  $("save").addEventListener("click", async () => {
    const pick = tiles.filter(t => t.rank);
    if (!pick.length) { msg("Pilih sekurang-kurangnya satu logo."); return; }
    if (new Set(pick.map(t => t.rank)).size !== pick.length) { msg("Ada nama rank yang sama dipilih dua kali."); return; }
    $("save").disabled = true; msg("Menyimpan…");
    const pin = $("pin").value || (() => { try { return localStorage.getItem("syno.adminPin") || ""; } catch (e) { return ""; } })();
    let ok = 0;
    for (const t of pick) {
      const blob = await new Promise(res => t.canvas.toBlob(res, "image/png"));
      const r = await fetch("api/rank-upload?name=" + t.rank, { method: "POST", headers: pin ? { "X-Pin": pin } : {}, body: blob }).catch(() => null);
      if (r && r.ok) ok++;
    }
    $("save").disabled = false;
    msg(ok === pick.length ? `Siap! ${ok} logo disimpan. Refresh overlay dalam OBS untuk lihat.` : `Hanya ${ok}/${pick.length} disimpan. START_OVERLAY.bat dah jalan? PIN betul?`);
  });
})();
</script>
</body>
</html>
