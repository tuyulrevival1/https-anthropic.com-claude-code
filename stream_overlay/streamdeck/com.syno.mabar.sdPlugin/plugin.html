<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><title>SYNO Mabar</title></head>
<body>
<script>
/* SYNO Mabar Stream Deck plugin.
   Tekan sekejap  = Menang / Kalah (atau W/L +1 sahaja, ikut tetapan butang)
   Tahan 0.6 saat = W / L tolak 1
   Tahan 2 saat   = reset butang ni sahaja (WIN jadi 0, atau LOSE jadi 0)
   Butang tunjuk bilangan W / L sekarang. Perlu START_OVERLAY.bat jalan di PC ni. */
"use strict";
const BASE_DEF = "http://127.0.0.1:8787", HOLD_MS = 600, LONG_MS = 2000;
let ws = null, last = { w: null, l: null, faceOff: null, handOff: null, closed: null };
const keys = {}; // context -> { action, settings, down, stage, t1, t2 }
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
const setTitle = (ctx, t) => send({ event: "setTitle", context: ctx, payload: { title: t, target: 0 } });
// draw the key: label on top, big number in the middle (Stream Deck shows the image; title stays empty)
const COL = { win: "#ffcf4a", lose: "#ff2346" };
// On / Off key: name on top, ON (green) / OFF (red) big
function toggleImage(name, on, words) {
  const c = document.createElement("canvas"); c.width = c.height = 144;
  const g = c.getContext("2d"), acc = on == null ? "#777" : on ? "#6dffb0" : "#ff2346";
  g.fillStyle = "#0e0609"; g.fillRect(0, 0, 144, 144);
  g.strokeStyle = acc; g.lineWidth = 6; g.strokeRect(5, 5, 134, 134);
  g.fillStyle = acc; g.fillRect(5, 5, 134, 30);
  g.fillStyle = "#0b0507"; g.font = "bold 20px 'Segoe UI', Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(name, 72, 21);
  const w = words || ["ON", "OFF"], txt = on == null ? "-" : on ? w[0] : w[1];
  g.font = `900 ${txt.length > 4 ? 30 : 46}px 'Arial Black', 'Segoe UI', Arial, sans-serif`; g.fillStyle = "#fff"; g.shadowColor = acc; g.shadowBlur = 14;
  g.fillText(txt, 72, 90);
  return c.toDataURL("image/png");
}
const TOG = { facecam: ["FACECAM", d => d.faceOff == null ? null : !d.faceOff], handcam: ["HANDCAM", d => d.handOff == null ? null : !d.handOff], mabar: ["MABAR VIP", d => d.closed == null ? null : !d.closed] };
const togOf = k => TOG[(k.settings && k.settings.tap) || "facecam"] ? (k.settings && k.settings.tap) || "facecam" : "facecam";
function showToggle(ctx, k) {
  const t = TOG[togOf(k)], on = t[1](last), key = "t|" + t[0] + "|" + on;
  if (k.shown === key) return; k.shown = key;
  send({ event: "setImage", context: ctx, payload: { image: toggleImage(t[0], on, t[0] === "MABAR VIP" ? ["OPEN", "CLOSED"] : null), target: 0 } });
  setTitle(ctx, "");
}
function keyImage(kd, big, small) {
  const c = document.createElement("canvas"); c.width = c.height = 144;
  const g = c.getContext("2d"), acc = COL[kd];
  g.fillStyle = "#0e0609"; g.fillRect(0, 0, 144, 144);
  const grd = g.createLinearGradient(0, 70, 0, 144); grd.addColorStop(0, "rgba(0,0,0,0)"); grd.addColorStop(1, kd === "win" ? "rgba(255,207,74,.28)" : "rgba(255,35,70,.3)");
  g.fillStyle = grd; g.fillRect(0, 0, 144, 144);
  g.strokeStyle = acc; g.lineWidth = 6; g.strokeRect(5, 5, 134, 134);
  g.fillStyle = acc; g.fillRect(5, 5, 134, 30);
  g.fillStyle = "#160a00"; g.font = "bold 22px 'Segoe UI', Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(small, 72, 21);
  const len = String(big).length, size = len <= 2 ? 72 : len === 3 ? 56 : 40;
  g.font = `900 ${size}px 'Arial Black', 'Segoe UI', Arial, sans-serif`;
  g.fillStyle = big === "-" ? "#777" : "#ffffff"; g.shadowColor = acc; g.shadowBlur = 14;
  g.fillText(String(big), 72, 92);
  return c.toDataURL("image/png");
}
function show(ctx, k, big, small) {
  const key = big + "|" + small;
  if (k.shown === key) return; k.shown = key;
  send({ event: "setImage", context: ctx, payload: { image: keyImage(kind(k.action), big, small), target: 0 } });
  setTitle(ctx, "");
}
const kind = a => /\.lose$/.test(a) ? "lose" : /\.toggle$/.test(a) ? "toggle" : "win";
const base = k => String((k && k.settings && k.settings.server) || BASE_DEF).trim().replace(/\/+$/, "");
const label = k => kind(k.action) === "win" ? "WIN" : "LOSE";
function paint(force) {
  for (const [ctx, k] of Object.entries(keys)) {
    if (k.down && !force) continue;
    if (force) k.shown = "";
    if (kind(k.action) === "toggle") { showToggle(ctx, k); continue; }
    const v = kind(k.action) === "win" ? last.w : last.l;
    show(ctx, k, v == null ? "-" : v, v == null ? "OFFLINE" : label(k));
  }
}
function refresh() {
  const any = Object.values(keys)[0]; if (!any) return;
  fetch(base(any) + "/api/wl", { cache: "no-store" }).then(r => r.json())
    .then(d => { last = { w: d.w, l: d.l, faceOff: d.faceOff == null ? null : !!d.faceOff, handOff: d.handOff == null ? null : !!d.handOff, closed: d.closed == null ? null : !!d.closed }; paint(); })
    .catch(() => { last = { w: null, l: null, faceOff: null, handOff: null, closed: null }; paint(); });
}
function run(ctx, k, name) {
  fetch(base(k) + "/api/do/" + name, { mode: "no-cors", cache: "no-store" })
    .then(() => send({ event: "showOk", context: ctx }))
    .catch(() => send({ event: "showAlert", context: ctx }))
    .finally(() => { setTimeout(refresh, 350); setTimeout(refresh, 900); });
}
function keyDown(ctx, k) {
  if (kind(k.action) === "toggle") return;
  k.down = Date.now(); k.stage = 0;
  show(ctx, k, "+1", label(k));
  k.t1 = setTimeout(() => { k.stage = 1; show(ctx, k, "-1", "TAHAN"); }, HOLD_MS);
  k.t2 = setTimeout(() => { k.stage = 2; show(ctx, k, "0", "RESET " + label(k)); }, LONG_MS);
}
function keyUp(ctx, k) {
  if (kind(k.action) === "toggle") {
    // flip right away on the key, then confirm from the overlay
    const t = togOf(k), f = t === "facecam" ? "faceOff" : t === "handcam" ? "handOff" : "closed";
    if (last[f] != null) last[f] = !last[f];
    paint(true); run(ctx, k, t + "-toggle"); return;
  }
  clearTimeout(k.t1); clearTimeout(k.t2);
  const w = kind(k.action) === "win", st = k.stage; k.down = 0;
  const tap = (k.settings && k.settings.tap) || (w ? "end-win" : "end-lose");
  const name = st === 2 ? (w ? "win-reset" : "lose-reset") : st === 1 ? (w ? "win-1" : "lose-1") : tap;
  if (last.w != null) {
    if (st === 2) { if (w) last.w = 0; else last.l = 0; }
    else if (w) last.w = Math.max(0, last.w + (st === 1 ? -1 : 1));
    else last.l = Math.max(0, last.l + (st === 1 ? -1 : 1));
  }
  paint(true);
  run(ctx, k, name);
}
function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent) {
  ws = new WebSocket("ws://127.0.0.1:" + inPort);
  ws.onopen = () => send({ event: inRegisterEvent, uuid: inUUID });
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    const ctx = m.context, p = m.payload || {};
    if (m.event === "willAppear") { keys[ctx] = { action: m.action, settings: p.settings || {} }; paint(); refresh(); }
    else if (m.event === "willDisappear") delete keys[ctx];
    else if (m.event === "didReceiveSettings" && keys[ctx]) { keys[ctx].settings = p.settings || {}; refresh(); }
    else if (m.event === "keyDown" && keys[ctx]) keyDown(ctx, keys[ctx]);
    else if (m.event === "keyUp" && keys[ctx]) keyUp(ctx, keys[ctx]);
  };
}
setInterval(refresh, 1000);
</script>
</body></html>
