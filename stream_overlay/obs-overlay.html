<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Overlay SYNO</title>
<link rel="stylesheet" href="assets/overlay.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  Browser source OBS / TikTok Live Studio: 1080 x 1920
  Satu layout sahaja (1080x1920). &hand=0 buang handcam, &bgfx=0 matikan asap latar.
  &banner=power | minimal | none
  &demo      tunjuk gambar contoh dalam lubang kamera (untuk preview sahaja)
-->
<div id="root"></div>
<script>window.OVERLAY_PRESET = {"banner": "power"}; /* ubah di sini kalau nak */</script>
<script src="assets/config.js"></script>
<script src="assets/roles.js"></script>
<script src="assets/overlay.js"></script>
<script src="assets/ranks3d.js"></script>
<script src="assets/banner-scene.js"></script>
<script src="assets/mascot.js"></script>
<script src="assets/banner-power.js"></script>
<script>
  // Tetapan dari URL (?banner=power&hand=0), atau dari fail preset (obs-overlay.html)
  const P = Object.assign({}, window.OVERLAY_PRESET || {});
  new URLSearchParams(location.search).forEach((v, k) => { P[k] = v; });
  const root = document.getElementById("root");
  const o = ChouOverlay.mount(root, {
    layout: 1, banner: P.banner || "power", accent: P.accent || undefined,
    bgfx: String(P.bgfx) !== "0", hand: String(P.hand) !== "0", demo: "demo" in P
  });
  ChouOverlay.fitStage(o.stage, root);

  // Shortcut keyboard (OBS: klik kanan source > Interact, kemudian tekan kekunci)
  //  W / L = tambah win / lose     Shift+W / Shift+L = tolak 1
  //  Q = on/off queue    B = on/off banner    H = on/off Welcome
  document.addEventListener("keydown", e => {
    const S = ChouOverlay.Store, k = e.key.toLowerCase(), d = e.shiftKey ? -1 : 1;
    if (k === "w") S.set(s => { s.wins = Math.max(0, s.wins + d); if (d > 0) s.streak = s.streak > 0 ? s.streak + 1 : 1; });
    else if (k === "l") S.set(s => { s.losses = Math.max(0, s.losses + d); if (d > 0) s.streak = s.streak < 0 ? s.streak - 1 : -1; });
    else if (k === "q") S.set(s => { s.showQueue = !s.showQueue; });
    else if (k === "b") S.set(s => { s.showBanner = !s.showBanner; });
    else if (k === "h") S.set(s => { s.showWelcome = !s.showWelcome; });
  });
</script>
</body>
</html>
